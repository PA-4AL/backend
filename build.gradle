plugins {
	id 'org.jetbrains.kotlin.jvm' version '2.2.21'
	id 'org.jetbrains.kotlin.plugin.spring' version '2.2.21'
	id 'org.springframework.boot' version '4.0.2'
	id 'io.spring.dependency-management' version '1.1.7'
    id "org.jooq.jooq-codegen-gradle" version "3.19.29"
}

group = 'org.example'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
	toolchain {
		// 21 LTS : Kotlin 2.2 ne supporte pas la target JVM 25 (max 24),
		// et l'image Docker de prod (infra) est en JRE 21.
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-jooq'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-liquibase'
	implementation 'org.jetbrains.kotlin:kotlin-reflect'
	implementation 'org.postgresql:postgresql'
	implementation 'tools.jackson.module:jackson-module-kotlin'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-jooq-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	jooqCodegen 'org.postgresql:postgresql'
}

kotlin {
	compilerOptions {
		freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

jooq {
    configuration {
        jdbc {
            driver = 'org.postgresql.Driver'
            // Base "pa" de l'infra (infra/docker-compose.yml), schéma spec §6
            url = 'jdbc:postgresql://localhost:5432/pa'
            user = 'pa'
            password = 'pa'
        }

        generator {
            name = 'org.jooq.codegen.KotlinGenerator'
            database {
                name = 'org.jooq.meta.postgres.PostgresDatabase'
                inputSchema = 'public'
                // Exclut le suivi Liquibase et les routines de l'extension pgcrypto
                excludes = 'databasechangelog.*|armor.*|dearmor|crypt|decrypt.*|digest|encrypt.*|gen_random_.*|gen_salt|hmac|pgp_.*'
            }
            target {
                packageName = 'org.example.backend.database'
                directory = 'src/main/kotlin'
            }
            generate {
                kotlinNotNullRecordAttributes = true
            }
        }
    }
}
