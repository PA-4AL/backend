spring:
  application:
    name: backend
  datasource:
    driver-class-name: org.postgresql.Driver
    # Base "pa" de l'infra (infra/docker-compose.yml) — surchargé par les
    # variables SPRING_DATASOURCE_* (Makefile infra, Cloud Run)
    url: jdbc:postgresql://localhost:5432/pa
    username: pa
    password: pa
  jooq:
    sql-dialect: POSTGRES
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          # Realm Keycloak (infra/keycloak/realm-pa-tournament.json)
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/pa-tournament}

management:
  endpoints:
    web:
      exposure:
        # Seule la santé est exposée : les autres endpoints Actuator
        # (env, beans, heapdump…) resteraient accessibles en interne.
        include: health
  endpoint:
    health:
      probes:
        # /actuator/health/readiness et /liveness pour les sondes Cloud Run.
        enabled: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
