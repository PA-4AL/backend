spring:
  application:
    name: backend
  datasource:
    driver-class-name: org.postgresql.Driver
    # Base "pa" de l'infra (infra/docker-compose.yml) — surchargé par les
    # variables SPRING_DATASOURCE_* (Makefile infra, Cloud Run)
    url: jdbc:postgresql://localhost:5432/pa
    username: pa
    password: pa
  jooq:
    sql-dialect: POSTGRES
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          # Realm Keycloak (infra/keycloak/realm-pa-tournament.json)
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/pa-tournament}

management:
  endpoints:
    web:
      exposure:
        # Seule la santé est exposée : les autres endpoints Actuator
        # (env, beans, heapdump…) resteraient accessibles en interne.
        include: health
  endpoint:
    health:
      probes:
        # /actuator/health/readiness et /liveness pour les sondes Cloud Run.
        enabled: true

app:
  pubsub:
    # Messagerie asynchrone avec le worker Rust. Désactivée par défaut : en local,
    # sans identifiants GCP, les imports Excel sont refusés proprement (503).
    enabled: ${APP_PUBSUB_ENABLED:false}
    project-id: ${GCP_PROJECT_ID:}
    topic-demands: ${PUBSUB_TOPIC_DEMANDS:}
    # Compte de service et audience attendus dans les jetons OIDC des livraisons
    # push (renseignés par Terraform sur Cloud Run).
    push-service-account: ${PUBSUB_PUSH_SERVICE_ACCOUNT:}
    push-audience: ${PUBSUB_PUSH_AUDIENCE:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
